server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control "no-store" always;

  # portal.health is an older address for the staff portal. Sign in only returns to staff. and admin.,
  # so starting it here ended on Cognito's redirect_mismatch page. Browsers keep the #fragment across
  # a redirect, so password links (whose secret sits after the #) still arrive intact.
  if ($host = "portal.health.kantage.solutions") {
    return 301 https://staff.health.kantage.solutions$request_uri;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
